# Product repository registry of the PIRL Hub. Each repository is a git submodule at .repos/<repo-id>.
# How to register and choose a repository: see the "Repository routing" section in AGENTS.md.
#
# Template entry (drop the `{}` on the `repos:` line when adding the first entry). Use only the YAML
# subset the validator reads: nested mappings, scalar lists, two-space indentation.
#
#   repos:
#     <repo-id>:
#       path: ".repos/<repo-id>"
#       product: "<product the repository serves>"
#       stack: "<main stack>"
#       keywords: ["<keyword>", "<keyword>"]
#       commands:
#         test: "<command that runs tests by file/class/name>"
#       context_docs: [".agents/llm-docs/repos/<repo-id>.md"]
#       rules: [".agents/llm-docs/rules/<name>.rule.md"]
schema: "pirl-repos/v1"
repos: {}
